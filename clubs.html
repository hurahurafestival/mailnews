<!doctype html>
<html lang="id" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101a17"><title>Direktori Klub — mailnews</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#0b1210;--panel:rgba(21,34,29,.78);--text:#edf5ef;--muted:#9aaba0;--line:#ffffff1c;--green:#a6f36a} [data-theme=light]{--bg:#eef4ef;--panel:#fff;--text:#17251c;--muted:#65756a;--line:#17321f20;--green:#377c27}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#31563a40,transparent 38%),var(--bg);color:var(--text);font:14px 'DM Sans',sans-serif}.wrap{max-width:1100px;margin:auto;padding:26px 20px 65px}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px}.brand{font:700 24px 'Space Grotesk';color:var(--green);text-decoration:none}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 14px;border-radius:12px;text-decoration:none;cursor:pointer}.eyebrow{color:var(--green);font-size:11px;font-weight:800;letter-spacing:2px}.heading{font:700 clamp(30px,5vw,44px) 'Space Grotesk';margin:10px 0}.muted{color:var(--muted)}.search{width:100%;max-width:520px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);margin:25px 0 15px;outline:0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.filter{padding:9px 14px;border-radius:30px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer}.filter.active{background:var(--green);color:#142313}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:18px;min-height:150px}.crest{font-size:28px;margin-bottom:12px}.card h2{font:700 17px 'Space Grotesk';margin:0 0 6px}.card p{color:var(--muted);font-size:12px;line-height:1.6;margin:0}.league{display:inline-block;color:var(--green);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-top:12px}.count{color:var(--muted);font-size:12px;margin:0 0 12px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><header class="bar"><a class="brand" href="index.html">⚽ mailnews</a><div><button class="btn" id="theme">Ganti tema</button> <a class="btn" href="index.html">← Beranda</a></div></header><div class="eyebrow">FOOTBALL CLUB DIRECTORY</div><h1 class="heading">Direktori klub sepak bola</h1><p class="muted">Jelajahi klub-klub populer dari Indonesia dan liga top dunia.</p><input class="search" id="search" placeholder="Cari nama klub, kota, atau liga…"><div class="filters" id="filters"><button class="filter active" data-league="Semua">Semua klub</button><button class="filter" data-league="Indonesia">Indonesia</button><button class="filter" data-league="Premier League">Premier League</button><button class="filter" data-league="La Liga">La Liga</button><button class="filter" data-league="Serie A">Serie A</button><button class="filter" data-league="Bundesliga">Bundesliga</button></div><p class="count" id="count"></p><section class="grid" id="grid"></section></main><script src="assets/club-logos.js"></script>
<script>
const clubs=[
['Persib Bandung','Bandung, Indonesia','Indonesia','🔵'],['Persija Jakarta','Jakarta, Indonesia','Indonesia','🟠'],['Arema FC','Malang, Indonesia','Indonesia','🦁'],['Persebaya Surabaya','Surabaya, Indonesia','Indonesia','🟢'],['Bali United','Bali, Indonesia','Indonesia','🔴'],['PSM Makassar','Makassar, Indonesia','Indonesia','🔴'],['Borneo FC','Samarinda, Indonesia','Indonesia','🟠'],['Dewa United','Tangerang, Indonesia','Indonesia','⚫'],['Manchester City','Manchester, Inggris','Premier League','🔵'],['Manchester United','Manchester, Inggris','Premier League','🔴'],['Liverpool','Liverpool, Inggris','Premier League','🔴'],['Arsenal','London, Inggris','Premier League','🔴'],['Chelsea','London, Inggris','Premier League','🔵'],['Tottenham Hotspur','London, Inggris','Premier League','⚪'],['Real Madrid','Madrid, Spanyol','La Liga','⚪'],['Barcelona','Barcelona, Spanyol','La Liga','🔵'],['Atlético Madrid','Madrid, Spanyol','La Liga','🔴'],['Sevilla','Sevilla, Spanyol','La Liga','⚪'],['Inter Milan','Milan, Italia','Serie A','🔵'],['AC Milan','Milan, Italia','Serie A','🔴'],['Juventus','Turin, Italia','Serie A','⚫'],['Napoli','Napoli, Italia','Serie A','🔵'],['Bayern München','Munich, Jerman','Bundesliga','🔴'],['Borussia Dortmund','Dortmund, Jerman','Bundesliga','🟡'],['Bayer Leverkusen','Leverkusen, Jerman','Bundesliga','🔴'],['RB Leipzig','Leipzig, Jerman','Bundesliga','🔴']];
let league='Semua',q='';const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function render(){const data=clubs.filter(c=>(league==='Semua'||c[2]===league)&&c.join(' ').toLowerCase().includes(q));document.getElementById('count').textContent=data.length+' klub ditemukan';document.getElementById('grid').innerHTML=data.length?data.map(c=>{const p=new URLSearchParams({name:c[0],city:c[1],league:c[2],crest:c[3]});return '<a class="card" style="display:block;text-decoration:none;color:inherit" href="club.html?'+p.toString()+'"><div class="crest">'+(window.mailnewsClubLogo(c[0])||esc(c[3]))+'</div><h2>'+esc(c[0])+'</h2><p>'+esc(c[1])+'</p><span class="league">'+esc(c[2])+' · LIHAT PROFIL ↗</span></a>'}).join(''):'<p class="muted">Klub tidak ditemukan.</p>'}document.getElementById('search').addEventListener('input',e=>{q=e.target.value.toLowerCase();render()});document.querySelectorAll('[data-league]').forEach(b=>b.onclick=()=>{league=b.dataset.league;document.querySelectorAll('[data-league]').forEach(x=>x.classList.toggle('active',x===b));render()});const saved=localStorage.getItem('mailnews-theme')||'dark';document.documentElement.dataset.theme=saved;document.getElementById('theme').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('mailnews-theme',t)};render();
</script></body></html>
